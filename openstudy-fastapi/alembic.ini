# Alembic Configuration File

[alembic]
script_location = alembic
prepend_sys_path = .
# 2026-09-23：随主线切到 PostgreSQL（原为 mysql+aiomysql://.../openstudy_v2）。
# 必须与 .env 的 PG_HOST/PG_PORT/PG_NAME/PG_USER/PG_PASSWORD 保持一致 ——
# 否则真跑起 alembic 时会静默打在旧 MySQL 回滚库上。
sqlalchemy.url = postgresql+asyncpg://root:123456@localhost:5432/openstudy_v2_pgsql

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
