[tool.poetry]
name = "openstudy-fastapi"
version = "1.0.0"
description = "OpenStudy Online Learning Platform - FastAPI Backend"
authors = ["OpenStudy Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = "^2.10"
pydantic-settings = "^2.6"
python-multipart = "^0.0.18"

# Security
python-jose = {extras = ["cryptography"], version = "^3.3"}
passlib = {extras = ["bcrypt"], version = "^1.7"}

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.30"
alembic = "^1.14"

# Redis
redis = {extras = ["hiredis"], version = "^5.2"}

# LangChain & AI
langchain = "^0.3"
langchain-core = "^0.3"
langchain-community = "^0.3"
langchain-openai = "^0.2"
openai = "^1.58"
zhipuai = "^2.1"
httpx = "^0.28"

# Document Processing
pypdf = "^5.0"
python-docx = "^1.1"
pytesseract = "^0.3"
Pillow = "^11.0"
# 题库导出 PDF（app/services/bank_export_service.py）；中文靠系统 CJK 字体或内置 STSong-Light
reportlab = "^4.2"
# Windows + MS Word：老版 .doc(OLE2) → .docx 转换（见 app/services/doc_converter.py）
pywin32 = { version = ">=306", markers = "sys_platform == 'win32'" }

# Utilities
loguru = "^0.7"
python-dateutil = "^2.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
httpx = "^0.28"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
