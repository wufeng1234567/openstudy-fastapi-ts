# ============================================================
# OpenStudy Nginx 站点配置（前端容器内置）
# ------------------------------------------------------------
# 职责：
#   1. 托管 Vue 构建产物（/usr/share/nginx/html）
#   2. SPA history 路由回退到 index.html
#   3. 把 API 前缀反代到后端容器（docker compose 服务名 backend:9101）
#
# 反代规则与开发期 vite.config.ts 的 proxy 一一对应：
#   /dev-api  → 去掉前缀后转发（前端 .env 用相对基址 '/'，故此处保留直通）
#   /ai /profile /rag /system /questionBank /... → 原样转发
# ============================================================
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 上传文件可能较大
    client_max_body_size 50m;

    # ⚠️ 预置轮播图静态资源：必须用 `^~` 前缀匹配，抢在下方「.jpg/.png 静态缓存」正则之前，
    #    否则 /carousel-static/xxx.jpg 会命中静态资源正则（~*）而本地找不到 → 404。
    location ^~ /carousel-static/ {
        proxy_pass         http://backend:9101/carousel-static/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # gzip（前端已产出 .gz，这里开 precompressed 可省 CPU）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;

    # 静态资源缓存（index.html 不缓存，避免发版后拿旧壳）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|map)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- API 反代到后端容器 ----------
    # /dev-api 前缀：开发态由 vite 去掉前缀；生产态前端已用相对基址，
    # 这里的请求路径不再带 /dev-api，保留该规则仅为兼容旧页面。
    location /dev-api/ {
        proxy_pass         http://backend:9101/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- 根级认证 / 系统接口 ----------
    # 注意：后端认证路由是**根路径**（无 /system 前缀），必须单独反代，
    # 否则 /login 会被 SPA 回退成 index.html，用户登不进来。
    location ~ ^/(login|logout|register|quickLogin|getInfo|getRouters|captchaImage)$ {
        proxy_pass         http://backend:9101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # 后端各业务前缀（与 vite proxy 对齐）
    location ~ ^/(ai|rag|profile|carousel-static|carousel|system|questionBank|questionMain|questionError|questionMarked|favoriteBank|favoriteQuestion|ws|swagger-ui\.html|v3/api-docs)(/|$) {
        proxy_pass         http://backend:9101;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # WebSocket 透传
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # SSE / 流式响应：关闭缓冲，避免 AI 流被攒住
        proxy_buffering    off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- SPA 回退 ----------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
