<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <!--
    站点图标 = 品牌标（黑底圆角 + 白 O），与侧栏 logo / 对话页 hero 同一套几何。
    · 优先 SVG（矢量，任何 DPR 都清晰）；
    · 下面那行 ico 是**兜底**：极老的浏览器 / 某些环境只会请求 /favicon.ico。
    ⚠️ 两者必须长得一样，否则标签页图标会和界内 logo 打架（历史上就是这个问题）。
  -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta name="theme-color" content="#0f1115">
  <title>OpenStudy · AI 智能学习</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    /*
      首屏加载态：与 DSH 一致的极简风格 —— 白底、一个细黑圆环、一枚品牌方块。
      不再用整屏紫色遮罩（那是旧模板遗留，和现在的设计语言不搭）。
    */
    html,
    body,
    #app {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #0f1115;
    }

    .chromeframe {
      margin: 0.2em 0;
      background: #ccc;
      color: #000;
      padding: 0.2em 0;
    }

    #loader-wrapper {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #fff;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    #loader {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #ebeef2;
      border-top-color: #0f1115;
      animation: spin 0.8s linear infinite;
    }

    .load_title {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #81858c;
    }

    .load_mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 7px;
      background: #0f1115;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      line-height: 1;
    }

    .loaded #loader-wrapper {
      opacity: 0;
      visibility: hidden;
    }

    .no-js #loader-wrapper {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #loader {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <div id="loader"></div>
      <div class="load_title"><span class="load_mark">O</span>OpenStudy</div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
